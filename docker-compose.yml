version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axionix-task-tracker-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=production_super_secret_jwt_key_axionix_2026
    volumes:
      - sqlite_data:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api-docs/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlite_data:
